<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>อัปโหลดสลิป — บันทึกรายรับ–รายจ่าย</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="app-nav"></div>

    <main>
      <div class="page-header">
        <h1>อัปโหลดสลิป</h1>
        <p>อัปโหลดรูปภาพสลิป แล้วกรอกข้อมูลจากสลิปเข้าสู่ระบบ</p>
      </div>

      <div class="panel">
        <div class="field">
          <label>รูปภาพสลิป *</label>
          <label class="slip-drop" for="slip-input" id="slip-drop-label">
            📎 คลิกเพื่อเลือกรูปภาพสลิป (โอนเงิน / จ่ายเงิน)
          </label>
          <input type="file" id="slip-input" accept="image/*" style="display:none;" required />
          <img id="slip-preview" class="slip-preview" style="display:none;" />
          <p class="suggest-hint" id="ocr-status" style="display:none;"></p>
        </div>

        <form id="slip-form" style="margin-top: 20px;">
          <div class="form-grid">
            <div class="field">
              <label for="amount">จำนวนเงิน (บาท) *</label>
              <input type="number" id="amount" min="0" step="0.01" required />
            </div>
            <div class="field">
              <label for="date">วันที่ *</label>
              <input type="date" id="date" required />
            </div>
            <div class="field">
              <label for="category">หมวดหมู่ *</label>
              <select id="category" required></select>
            </div>
            <div class="field">
              <label for="payment_method">วิธีการชำระเงิน</label>
              <select id="payment_method">
                <option value="โอนเงิน">โอนเงิน</option>
                <option value="พร้อมเพย์">พร้อมเพย์</option>
                <option value="e-wallet">e-wallet</option>
                <option value="เงินสด">เงินสด</option>
                <option value="บัตรเครดิต">บัตรเครดิต</option>
              </select>
            </div>
            <div class="field field--full">
              <label for="merchant">ร้านค้า / ผู้รับเงิน *</label>
              <input type="text" id="merchant" placeholder="เช่น 7-Eleven, Grab" required />
            </div>
            <div class="field field--full">
              <label for="description">รายละเอียดรายการ</label>
              <textarea id="description" placeholder="รายละเอียดเพิ่มเติมจากสลิป (ถ้ามี)"></textarea>
              <p class="suggest-hint" id="suggest-hint" style="display:none;"></p>
            </div>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn">บันทึกรายการจากสลิป</button>
            <a href="transactions.html" class="btn btn--secondary">ยกเลิก</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/categorySuggest.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/uploadSlip.js"></script>
</body>
</html>
